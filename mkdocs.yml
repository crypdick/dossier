site_name: dossier
site_description: A structured logging library for AI agents with session management and object unpacking
site_url: https://dossier.ricardodecal.com/
site_author: Ricardo Decal
repo_url: https://github.com/crypdick/dossier
repo_name: crypdick/dossier

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.integrate

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets
  - admonition

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            inherited_members: true
            filters:
              - "!^_[^_]"
  - llmstxt:
      markdown_description: |
        A structured logging library with session management and object unpacking, built on structlog.
        Perfect for AI agents - organize logs by session and automatically unpack dataclasses,
        Pydantic models, LangChain messages, and more into structured JSONL logs.
      full_output: llms-full.txt
      sections:
        Documentation:
          - index.md
          - processors.md
          - integrations.md

nav:
  - Home: index.md
  - Custom Processors: processors.md
  - Integrations: integrations.md
  - API Reference: reference/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/crypdick/dossier
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/dossier/
